import groovy.json.JsonOutput
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

// Run once to import the imagegen output, or rerun using the retained source PNG.
// ./gradlew --no-configuration-cache -I art/export-neil-atlas.gradle exportNeilAtlas -PneilPoses=/absolute/path/to/poses.png
gradle.projectsEvaluated {
    rootProject.tasks.register("exportNeilAtlas") {
        doLast {
            def root = rootProject.projectDir
            def source = new File(root, "art/source/neil_additional_poses.png")
            def inputPath = rootProject.findProperty("neilPoses")
            if (inputPath != null) {
                source.parentFile.mkdirs()
                java.nio.file.Files.copy(new File(inputPath.toString()).toPath(), source.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            def walkSource = new File(root, "art/source/neil_walk_cycle.png")
            def walkPath = rootProject.findProperty("neilWalk")
            if (walkPath != null) {
                java.nio.file.Files.copy(new File(walkPath.toString()).toPath(), walkSource.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            def walk = walkSource.exists() ? ImageIO.read(walkSource) : null
            if (walkSource.exists()) {
                assert walk != null && walk.colorModel.hasAlpha() : "Walk sheet needs RGBA transparency"
                assert walk.width % 3 == 0 && walk.height % 2 == 0 : "Walk sheet must use a 3 by 2 grid"
            }
            def legacyFile = new File(root, "app/src/main/assets/neil_sprite_sheet.txt")
            def legacy = ImageIO.read(new ByteArrayInputStream(Base64.mimeDecoder.decode(legacyFile.text.trim())))
            def poses = ImageIO.read(source)
            assert legacy != null && poses != null : "Both sprite inputs must decode as PNG"
            assert legacy.colorModel.hasAlpha() && poses.colorModel.hasAlpha() : "Sprites need transparency"
            def inputs = [legacy, poses]
            int cellWidth = inputs.collect { (int)(it.width / 4) }.max()
            int cellHeight = inputs.collect { (int)(it.height / 4) }.max()
            def atlas = new BufferedImage(cellWidth * 4, cellHeight * 8, BufferedImage.TYPE_INT_ARGB)
            def names = (0..3).collect { "legacy_idle_${it}" } +
                (0..3).collect { "legacy_walk_${it}" } +
                ["jump", "fall", "land", "hurt"] +
                (0..3).collect { "legacy_use_${it}" } +
                ["idle_right"] + (1..6).collect { "walk_right_${it}" } +
                ["idle_front", "idle_back", "shrug", "point_right", "idle_left",
                 "climb_left", "climb_right", "climb_alternate", "climb_rest"]
            def frames = []
            def graphics = atlas.createGraphics()
            try {
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
                inputs.eachWithIndex { input, sheet ->
                    int width = (int)(input.width / 4)
                    int height = (int)(input.height / 4)
                    (0..<16).each { local ->
                        int index = sheet * 16 + local
                        int sx = (local % 4) * width
                        int sy = (int)(local / 4) * height
                        int x = (index % 4) * cellWidth
                        int y = (int)(index / 4) * cellHeight
                        // Lossless packing: no redraw, filtering, or resizing of either source.
                        int dx = x + (int)((cellWidth - width) / 2)
                        int dy = y + cellHeight - height
                        if (walk != null && index in 17..22) {
                            int phase = index - 17
                            int walkWidth = (int)(walk.width / 3)
                            int walkHeight = (int)(walk.height / 2)
                            int wx = (phase % 3) * walkWidth
                            int wy = (int)(phase / 3) * walkHeight
                            int minTorsoX = walkWidth, maxTorsoX = -1
                            for (int py = (int)(walkHeight * 0.2); py <= (int)(walkHeight * 0.6); py++) {
                                for (int px = 0; px < walkWidth; px++) {
                                    if ((walk.getRGB(wx + px, wy + py) >>> 24) > 128) {
                                        if (px < minTorsoX) minTorsoX = px
                                        if (px > maxTorsoX) maxTorsoX = px
                                    }
                                }
                            }
                            double torsoCenter = (minTorsoX + maxTorsoX) / 2.0
                            double cellCenter = walkWidth / 2.0
                            int shift = (int) Math.round((cellCenter - torsoCenter) * cellWidth / walkWidth)
                            graphics.drawImage(walk, x + shift, y, x + shift + cellWidth, y + cellHeight,
                                wx, wy, wx + walkWidth, wy + walkHeight, null)
                        } else {
                            graphics.drawImage(input, dx, dy, dx + width, dy + height,
                                sx, sy, sx + width, sy + height, null)
                        }
                        int baseline = 0
                        int visible = 0
                        for (int py = 0; py < cellHeight; py++) {
                            for (int px = 0; px < cellWidth; px++) {
                                if ((atlas.getRGB(x + px, y + py) >>> 24) > 128) {
                                    baseline = py + 1
                                    visible++
                                }
                            }
                        }
                        assert baseline > 0 && visible < cellWidth * cellHeight * 0.8 :
                            "Frame ${index} must contain a sprite surrounded by transparency"
                        frames.add([name: names[index], x: x, y: y,
                            width: cellWidth, height: cellHeight, baseline: baseline])
                    }
                }
            } finally {
                graphics.dispose()
            }
            // Normalize hair, then add the same restrained sheen before checking
            // unchanged frames. The original source sheets retain their full palette.
            def rawAtlas = new File(temporaryDir, "neil-raw.png")
            def darkAtlas = new File(temporaryDir, "neil-dark.png")
            assert ImageIO.write(atlas, "png", rawAtlas)
            rootProject.providers.exec {
                commandLine(new File(System.getProperty("java.home"), "bin/java").absolutePath,
                    new File(root, "art/RemoveNeilHairHighlights.java").absolutePath,
                    rawAtlas.absolutePath, darkAtlas.absolutePath)
            }.result.get().assertNormalExitValue()
            rootProject.providers.exec {
                commandLine(new File(System.getProperty("java.home"), "bin/java").absolutePath,
                    new File(root, "art/AddNeilHairHighlights.java").absolutePath,
                    darkAtlas.absolutePath, darkAtlas.absolutePath)
            }.result.get().assertNormalExitValue()
            atlas = ImageIO.read(darkAtlas)
            def destination = new File(root, "art/sprites")
            destination.mkdirs()
            def atlasFile = new File(destination, "neil_sprite_atlas.png")
            if (walkPath != null && inputPath == null && atlasFile.exists()) {
                def previous = ImageIO.read(atlasFile)
                assert previous.width == atlas.width && previous.height >= atlas.height
                for (int py = 0; py < atlas.height; py++) {
                    for (int px = 0; px < atlas.width; px++) {
                        int frame = (int)(py / cellHeight) * 4 + (int)(px / cellWidth)
                        if (!(frame in 17..22)) {
                            assert previous.getRGB(px, py) == atlas.getRGB(px, py) :
                                "Non-walking frame ${frame} changed"
                        }
                    }
                }
                println("Verified all 26 non-walking frames are pixel-identical.")
            }
            assert ImageIO.write(atlas, "png", atlasFile)
            new File(destination, "neil_sprite_atlas.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [image: "neil_sprite_atlas.png", columns: 4, rows: 8, frames: frames])) + "\n"
            println("Exported ${atlas.width} x ${atlas.height} RGBA PNG with ${frames.size()} frames.")
        }
        finalizedBy("exportNeilSmoothWalk")
    }

    // Append a complete twelve-pose cycle without moving any existing atlas index.
    rootProject.tasks.register("exportNeilSmoothWalk") {
        onlyIf { new File(rootProject.projectDir, "art/source/neil_walk_cycle_12.png").exists() }
        doLast {
            def root = rootProject.projectDir
            def atlasFile = new File(root, "art/sprites/neil_sprite_atlas.png")
            def metadataFile = new File(root, "art/sprites/neil_sprite_atlas.json")
            def previous = ImageIO.read(atlasFile)
            def manifest = new groovy.json.JsonSlurper().parse(metadataFile)
            def sheet = ImageIO.read(new File(root, "art/source/neil_walk_cycle_12.png"))
            assert sheet != null && sheet.colorModel.hasAlpha()
            assert sheet.width % 4 == 0 && sheet.height % 3 == 0 : "Expected a 4 by 3 walk sheet"
            assert manifest.frames.size() >= 32 && manifest.columns == 4
            int cell = manifest.frames[0].width
            assert previous.width == cell * 4 && previous.height >= cell * 8
            int sw = (int)(sheet.width / 4), sh = (int)(sheet.height / 3)

            def bounds = { image, int x, int y, int width, int height, boolean hat ->
                int left = width, top = height, right = -1, bottom = -1
                for (int py = 0; py < height; py++) {
                    for (int px = 0; px < width; px++) {
                        int p = image.getRGB(x + px, y + py)
                        int r = (p >>> 16) & 255, g = (p >>> 8) & 255, b = p & 255
                        boolean selected = (p >>> 24) > 128
                        if (hat) selected &= py < height * 0.4 && r > g * 1.25 && b > r * 1.05
                        if (selected) {
                            left = Math.min(left, px); right = Math.max(right, px)
                            top = Math.min(top, py); bottom = Math.max(bottom, py)
                        }
                    }
                }
                assert right >= left && bottom >= top : "Missing sprite or purple hat"
                [left: left, top: top, right: right, bottom: bottom]
            }
            def sourceBounds = (0..<12).collect { i ->
                bounds(sheet, (i % 4) * sw, (int)(i / 4) * sh, sw, sh, false)
            }
            def heights = sourceBounds.collect { it.bottom - it.top + 1 }.sort()
            def reference = manifest.frames[17]
            def refBounds = bounds(previous, reference.x as int, reference.y as int, cell, cell, false)
            def refHat = bounds(previous, reference.x as int, reference.y as int, cell, cell, true)
            double scale = (refBounds.bottom - refBounds.top + 1) / ((heights[5] + heights[6]) / 2.0)
            double anchorX = (refHat.left + refHat.right) / 2.0
            int baseline = reference.baseline
            def packed = new BufferedImage(cell * 4, cell * 3, BufferedImage.TYPE_INT_ARGB)
            def graphics = packed.createGraphics()
            try {
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
                (0..<12).each { i ->
                    int sx = (i % 4) * sw, sy = (int)(i / 4) * sh
                    def box = sourceBounds[i]
                    def hat = bounds(sheet, sx, sy, sw, sh, true)
                    int dx = (int)Math.round(anchorX - (hat.left + hat.right) / 2.0 * scale)
                    int dy = baseline - (int)Math.round((box.bottom + 1) * scale)
                    int dw = (int)Math.round(sw * scale), dh = (int)Math.round(sh * scale)
                    assert dx + box.left * scale >= 0 && dx + (box.right + 1) * scale <= cell
                    assert dy + box.top * scale >= 0 && dy + (box.bottom + 1) * scale <= cell
                    int x = (i % 4) * cell, y = (int)(i / 4) * cell
                    graphics.setClip(x, y, cell, cell)
                    graphics.drawImage(sheet, x + dx, y + dy, x + dx + dw, y + dy + dh,
                        sx, sy, sx + sw, sy + sh, null)
                }
            } finally {
                graphics.dispose()
            }
            def rawWalk = new File(temporaryDir, "walk-raw.png")
            def darkWalk = new File(temporaryDir, "walk-dark.png")
            assert ImageIO.write(packed, "png", rawWalk)
            rootProject.providers.exec {
                commandLine(new File(System.getProperty("java.home"), "bin/java").absolutePath,
                    new File(root, "art/RemoveNeilHairHighlights.java").absolutePath,
                    rawWalk.absolutePath, darkWalk.absolutePath)
            }.result.get().assertNormalExitValue()
            rootProject.providers.exec {
                commandLine(new File(System.getProperty("java.home"), "bin/java").absolutePath,
                    new File(root, "art/AddNeilHairHighlights.java").absolutePath,
                    darkWalk.absolutePath, darkWalk.absolutePath)
            }.result.get().assertNormalExitValue()
            packed = ImageIO.read(darkWalk)
            def atlas = new BufferedImage(cell * 4, cell * 11, BufferedImage.TYPE_INT_ARGB)
            def originalPixels = previous.getRGB(0, 0, cell * 4, cell * 8, null, 0, cell * 4)
            atlas.setRGB(0, 0, cell * 4, cell * 8, originalPixels, 0, cell * 4)
            atlas.setRGB(0, cell * 8, cell * 4, cell * 3,
                packed.getRGB(0, 0, cell * 4, cell * 3, null, 0, cell * 4), 0, cell * 4)
            def frames = manifest.frames.take(32)
            def silhouettes = [] as Set
            (0..<12).each { i ->
                int x = (i % 4) * cell, y = (int)(i / 4) * cell
                def box = bounds(packed, x, y, cell, cell, false)
                assert box.bottom + 1 in (baseline - 1)..(baseline + 1) : "Foot baseline drift"
                silhouettes.add(java.util.Arrays.hashCode(packed.getRGB(x, y + (int)(cell * 0.6),
                    cell, cell - (int)(cell * 0.6), null, 0, cell)))
                frames.add([name: "smooth_walk_right_${i + 1}", x: x, y: y + cell * 8,
                    width: cell, height: cell, baseline: box.bottom + 1])
            }
            assert silhouettes.size() == 12 : "All twelve lower-body poses must be distinct"
            assert java.util.Arrays.equals(originalPixels,
                atlas.getRGB(0, 0, cell * 4, cell * 8, null, 0, cell * 4))
            assert ImageIO.write(atlas, "png", atlasFile)
            metadataFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [image: "neil_sprite_atlas.png", columns: 4, rows: 11, frames: frames])) + "\n"
            println("Exported 12 distinct walk poses at indices 32–43; original 32 frames pixel-identical.")
        }
    }
}
